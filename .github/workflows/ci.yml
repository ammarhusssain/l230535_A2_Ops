name: VisionGuard CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt flake8 pytest
      - run: flake8 app tests --max-line-length 130
      - run: pytest -q
      - run: docker build -f app/Dockerfile -t l230535-web:ci .